<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%">
  <defs>
    <linearGradient id="fsm11Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="fsm11Arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
    </marker>
    <marker id="fsm11ArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="fsm11ArrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="url(#fsm11Bg)" rx="16"/>
  <rect x="1" y="1" width="958" height="638" fill="none" stroke="#1f2937" stroke-width="2" rx="15"/>

  <!-- Title -->
  <text x="480" y="42" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Txtro Phase 11: Contextual Reply Dock &amp; Swipe Finite State Machine (FSM)</text>
  <text x="480" y="65" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">Operational Transitions Across Desktop Hover, Touch Gestures, Input Docks &amp; Navigation</text>

  <!-- Start Circle -->
  <circle cx="90" cy="180" r="14" fill="#6366f1"/>
  <circle cx="90" cy="180" r="8" fill="#e0e7ff"/>
  <line x1="104" y1="180" x2="165" y2="180" stroke="#6366f1" stroke-width="2" marker-end="url(#fsm11Arrow)"/>

  <!-- STATE 1: IDLE -->
  <g transform="translate(175, 135)">
    <rect width="180" height="90" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" rx="12"/>
    <text x="90" y="32" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">IDLE</text>
    <text x="90" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Standard chat stream</text>
    <text x="90" y="68" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">replyingTo === null</text>
  </g>

  <!-- Transition Idle -> Swiping -->
  <path d="M 355 165 L 530 165" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#fsm11Arrow)"/>
  <text x="440" y="155" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Touch Drag Right</text>
  <text x="440" y="185" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">dx &gt; 8px &amp; horizontal</text>

  <!-- STATE 2: SWIPING -->
  <g transform="translate(540, 135)">
    <rect width="220" height="90" fill="#064e3b" stroke="#10b981" stroke-width="2" rx="12"/>
    <text x="110" y="32" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SWIPING (GESTURE)</text>
    <text x="110" y="52" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">transform: translateX(dx * 0.45)</text>
    <text x="110" y="68" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">0 reflows (GPU composite)</text>
  </g>

  <!-- Transition Swiping -> Idle (Under Threshold / Spring Return) -->
  <path d="M 580 225 C 500 290, 340 290, 275 225" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#fsm11Arrow)"/>
  <text x="420" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Release dx &lt; 60px (Spring return to 0)</text>

  <!-- Transition Swiping / Desktop Click -> Reply Dock Mounted -->
  <path d="M 760 180 L 830 180 C 860 180, 860 380, 770 380" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#fsm11ArrowGreen)"/>
  <text x="880" y="275" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Threshold Met (dx &gt;= 60px)</text>
  <text x="880" y="292" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">or Desktop &apos;Reply&apos; Click</text>

  <!-- STATE 3: REPLY DOCK MOUNTED -->
  <g transform="translate(540, 340)">
    <rect width="220" height="90" fill="#3b0764" stroke="#a855f7" stroke-width="2" rx="12"/>
    <text x="110" y="32" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">REPLY DOCK MOUNTED</text>
    <text x="110" y="52" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Banner above MessageInput</text>
    <text x="110" y="68" fill="#c084fc" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Textarea auto-focused</text>
  </g>

  <!-- Transition Reply Dock -> Idle (Dismiss / Cancel) -->
  <path d="M 540 385 L 290 385 C 250 385, 230 300, 240 225" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#fsm11Arrow)"/>
  <text x="390" y="375" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Click [X] / Escape key / unmount</text>

  <!-- Transition Reply Dock -> Sending / Optimistic -->
  <path d="M 650 430 L 650 490 L 460 490" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#fsm11ArrowGreen)"/>
  <text x="555" y="480" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Hit Enter / Click Send</text>

  <!-- STATE 4: OPTIMISTIC QUOTED MESSAGE -->
  <g transform="translate(240, 450)">
    <rect width="210" height="90" fill="#14532d" stroke="#22c55e" stroke-width="2" rx="12"/>
    <text x="105" y="32" fill="#86efac" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">OPTIMISTIC QUOTED BUBBLE</text>
    <text x="105" y="52" fill="#bbf7d0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Quote card renders at 0ms</text>
    <text x="105" y="68" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Background HTTP POST</text>
  </g>

  <!-- Transition Optimistic -> Idle (Complete) -->
  <path d="M 310 450 L 310 225" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#fsm11ArrowGreen)"/>
  <text x="360" y="320" fill="#4ade80" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">HTTP 201 Created</text>
  <text x="360" y="336" fill="#86efac" font-family="system-ui, sans-serif" font-size="8.5">Reconcile tempId -> _id</text>
</svg>