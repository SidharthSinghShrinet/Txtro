<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" width="100%" height="100%">
  <defs>
    <linearGradient id="seq11Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="seq11Arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
    </marker>
    <marker id="seq11ArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="seq11ArrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <rect width="1100" height="860" fill="url(#seq11Bg)" rx="16"/>
  <rect x="1" y="1" width="1098" height="858" fill="none" stroke="#1f2937" stroke-width="2" rx="15"/>

  <!-- Title -->
  <text x="550" y="42" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Txtro Phase 11: End-to-End Reply Lifecycle &amp; Navigation Map</text>
  <text x="550" y="65" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">User Interaction • Docked Banner • 0ms Optimistic Mount • Server Snapshot Freeze • Real-Time Delivery • Click-to-Jump</text>

  <!-- Lifeline Headers -->
  <!-- Col 1: Client A (User) -->
  <rect x="50" y="85" width="130" height="42" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" rx="8"/>
  <text x="115" y="105" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Client A UI</text>
  <text x="115" y="119" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">(Originator)</text>
  <line x1="115" y1="127" x2="115" y2="820" stroke="#312e81" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Col 2: MessageInput Dock -->
  <rect x="230" y="85" width="130" height="42" fill="#064e3b" stroke="#10b981" stroke-width="1.5" rx="8"/>
  <text x="295" y="105" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">MessageInput</text>
  <text x="295" y="119" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">(Reply Banner)</text>
  <line x1="295" y1="127" x2="295" y2="820" stroke="#065f46" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Col 3: Express API -->
  <rect x="410" y="85" width="130" height="42" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" rx="8"/>
  <text x="475" y="105" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Node.js Express</text>
  <text x="475" y="119" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">(sendMessage)</text>
  <line x1="475" y1="127" x2="475" y2="820" stroke="#1e40af" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Col 4: MongoDB Atlas -->
  <rect x="590" y="85" width="130" height="42" fill="#831843" stroke="#f43f5e" stroke-width="1.5" rx="8"/>
  <text x="655" y="105" fill="#ffe4e6" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">MongoDB Atlas</text>
  <text x="655" y="119" fill="#fda4af" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">(Hybrid Snapshot)</text>
  <line x1="655" y1="127" x2="655" y2="820" stroke="#9f1239" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Col 5: Socket.IO Server -->
  <rect x="770" y="85" width="130" height="42" fill="#581c87" stroke="#a855f7" stroke-width="1.5" rx="8"/>
  <text x="835" y="105" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Socket.IO Server</text>
  <text x="835" y="119" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">(Broadcaster)</text>
  <line x1="835" y1="127" x2="835" y2="820" stroke="#6b21a8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Col 6: Client B (Peer) -->
  <rect x="940" y="85" width="120" height="42" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" rx="8"/>
  <text x="1000" y="105" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Client B (Peer)</text>
  <text x="1000" y="119" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">(Recipient)</text>
  <line x1="1000" y1="127" x2="1000" y2="820" stroke="#312e81" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Step 1: User swipes / clicks reply -->
  <line x1="115" y1="155" x2="295" y2="155" stroke="#6366f1" stroke-width="1.8" marker-end="url(#seq11Arrow)"/>
  <text x="205" y="147" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">1. Swipe right / Click &apos;Reply&apos;</text>

  <!-- Step 2: Dock Preview mounts -->
  <rect x="250" y="170" width="90" height="36" fill="#065f46" rx="4"/>
  <text x="295" y="186" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Mount Banner</text>
  <text x="295" y="198" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Auto-focus input</text>

  <!-- Step 3: User types & hits send -->
  <line x1="115" y1="230" x2="295" y2="230" stroke="#10b981" stroke-width="1.8" marker-end="url(#seq11ArrowGreen)"/>
  <text x="205" y="222" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">2. Type reply &amp; Press Enter</text>

  <!-- Step 4: 0ms Optimistic Mount -->
  <rect x="70" y="245" width="90" height="40" fill="#312e81" rx="4"/>
  <text x="115" y="261" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">0ms Bubble</text>
  <text x="115" y="275" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Render Quote Card</text>

  <!-- Step 5: POST to API -->
  <line x1="115" y1="305" x2="475" y2="305" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#seq11Arrow)"/>
  <text x="295" y="297" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">3. POST /send/:id { message, replyTo }</text>

  <!-- Step 6: Mongo findById & snapshot -->
  <line x1="475" y1="345" x2="655" y2="345" stroke="#f43f5e" stroke-width="1.8" marker-end="url(#seq11ArrowRose)"/>
  <text x="565" y="337" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">4. findById(replyTo) populate sender</text>

  <line x1="655" y1="380" x2="475" y2="380" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#seq11ArrowRose)"/>
  <text x="565" y="373" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">5. Freeze immutable replySnapshot</text>

  <!-- Step 7: Mongo Insert -->
  <line x1="475" y1="420" x2="655" y2="420" stroke="#f43f5e" stroke-width="2" marker-end="url(#seq11ArrowRose)"/>
  <text x="565" y="412" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">6. Insert newMessage with replySnapshot</text>

  <line x1="655" y1="455" x2="475" y2="455" stroke="#10b981" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#seq11ArrowGreen)"/>
  <text x="565" y="448" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">7. Document committed (HTTP 201)</text>

  <!-- Step 8: Return 201 to Client A -->
  <line x1="475" y1="490" x2="115" y2="490" stroke="#10b981" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#seq11ArrowGreen)"/>
  <text x="295" y="482" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">8. Reconcile tempId -> permanent _id</text>

  <!-- Step 9: Broadcast to Socket.IO -->
  <line x1="475" y1="535" x2="835" y2="535" stroke="#a855f7" stroke-width="2" marker-end="url(#seq11Arrow)"/>
  <text x="655" y="527" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">9. Broadcast newMessage event</text>

  <!-- Step 10: Deliver to Client B -->
  <line x1="835" y1="575" x2="1000" y2="575" stroke="#a855f7" stroke-width="2" marker-end="url(#seq11Arrow)"/>
  <text x="917" y="567" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">10. Deliver to peer (~40ms)</text>

  <rect x="955" y="590" width="90" height="40" fill="#312e81" rx="4"/>
  <text x="1000" y="606" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Mount Quote</text>
  <text x="1000" y="620" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">0ms join decode</text>

  <!-- Step 11: Jump-to-Message Navigation Flow -->
  <rect x="180" y="660" width="740" height="150" fill="#111827" stroke="#3b82f6" stroke-width="1.5" rx="10"/>
  <text x="550" y="682" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CLICK-TO-JUMP SMOOTH SCROLLING SUB-LIFECYCLE</text>

  <text x="210" y="715" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• User clicks quoted preview card in bubble</text>
  <text x="210" y="735" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10.5">  document.getElementById(&apos;msg-&apos; + replyTo).scrollIntoView({ behavior: &apos;smooth&apos;, block: &apos;center&apos; })</text>

  <text x="210" y="765" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• ChatContainer activates 2-second target pulse highlight ring</text>
  <text x="210" y="785" fill="#10b981" font-family="system-ui, sans-serif" font-size="10.5">  setHighlightedMessageId(replyTo) ➔ ring-2 ring-indigo-500 animate-pulse ➔ auto-clears at 2000ms</text>
</svg>