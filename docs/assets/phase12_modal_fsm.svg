<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%">
  <defs>
    <linearGradient id="fsm12Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="fsm12Arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
    </marker>
    <marker id="fsm12ArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="fsm12ArrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="url(#fsm12Bg)" rx="16"/>
  <rect x="1" y="1" width="958" height="638" fill="none" stroke="#1f2937" stroke-width="2" rx="15"/>

  <!-- Title -->
  <text x="480" y="42" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Txtro Phase 12: Deletion Modal &amp; Mode Selection Finite State Machine</text>
  <text x="480" y="65" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">State Transitions Across Hover Actions, 48-Hour Boundaries &amp; Optimistic Execution</text>

  <!-- Start Circle -->
  <circle cx="90" cy="180" r="14" fill="#6366f1"/>
  <circle cx="90" cy="180" r="8" fill="#e0e7ff"/>
  <line x1="104" y1="180" x2="165" y2="180" stroke="#6366f1" stroke-width="2" marker-end="url(#fsm12Arrow)"/>

  <!-- STATE 1: IDLE -->
  <g transform="translate(175, 135)">
    <rect width="180" height="90" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" rx="12"/>
    <text x="90" y="32" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">IDLE</text>
    <text x="90" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Active message bubble</text>
    <text x="90" y="68" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">confirmDeleteMessage === null</text>
  </g>

  <!-- Transition Idle -> Modal Open -->
  <path d="M 355 165 L 530 165" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#fsm12Arrow)"/>
  <text x="440" y="155" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Click Trash Icon</text>
  <text x="440" y="185" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Desktop / Mobile</text>

  <!-- STATE 2: MODAL OPEN -->
  <g transform="translate(540, 135)">
    <rect width="220" height="90" fill="#064e3b" stroke="#10b981" stroke-width="2" rx="12"/>
    <text x="110" y="32" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">MODAL OPEN</text>
    <text x="110" y="52" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">WhatsApp-style dialog</text>
    <text x="110" y="68" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Evaluate Authorization Guard</text>
  </g>

  <!-- Transition Modal -> Idle (Cancel) -->
  <path d="M 580 225 C 500 290, 340 290, 275 225" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#fsm12Arrow)"/>
  <text x="420" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Click &apos;Cancel&apos; / Backdrop / Esc</text>

  <!-- Transition Modal -> Delete for Me (Local ID Exclusion) -->
  <path d="M 760 165 L 850 165 C 880 165, 880 470, 770 470" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#fsm12Arrow)"/>
  <text x="895" y="315" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Select &apos;Delete for Me&apos;</text>
  <text x="895" y="332" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">(Always Available)</text>

  <!-- Transition Modal -> Delete for Everyone -->
  <path d="M 650 225 L 650 340" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#fsm12ArrowRose)"/>
  <text x="690" y="275" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Select &apos;Everyone&apos;</text>
  <text x="690" y="292" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">(isSender &amp;&amp; age &lt;= 48h)</text>

  <!-- STATE 3: TOMBSTONED (FOR EVERYONE) -->
  <g transform="translate(540, 340)">
    <rect width="220" height="90" fill="#3b0764" stroke="#a855f7" stroke-width="2" rx="12"/>
    <text x="110" y="32" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">TOMBSTONED (EVERYONE)</text>
    <text x="110" y="52" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">🚫 You deleted message</text>
    <text x="110" y="68" fill="#c084fc" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Media &amp; text erased permanently</text>
  </g>

  <!-- STATE 4: FILTERED OUT (FOR ME) -->
  <g transform="translate(540, 470)">
    <rect width="220" height="90" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" rx="12"/>
    <text x="110" y="32" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">EXCLUDED (FOR ME)</text>
    <text x="110" y="52" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">0 trace on active user screen</text>
    <text x="110" y="68" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Partner client sees message intact</text>
  </g>

  <!-- Transition Tombstoned -> Complete -->
  <path d="M 540 385 L 290 385 C 250 385, 230 300, 240 225" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#fsm12ArrowGreen)"/>
  <text x="380" y="375" fill="#4ade80" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">HTTP 200 + Socket Broadcast</text>

  <!-- Transition Excluded -> Complete -->
  <path d="M 540 515 L 230 515 C 190 515, 170 300, 200 225" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#fsm12ArrowGreen)"/>
  <text x="350" y="505" fill="#4ade80" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">HTTP 200 (Atomic $addToSet)</text>
</svg>