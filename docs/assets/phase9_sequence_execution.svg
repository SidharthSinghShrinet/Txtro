<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" width="100%" height="100%">
  <defs>
    <linearGradient id="seqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="seqArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
    </marker>
    <marker id="seqArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="seqArrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <rect width="1100" height="860" fill="url(#seqBg)" rx="16"/>
  <rect x="1" y="1" width="1098" height="858" fill="none" stroke="#1e293b" stroke-width="2" rx="15"/>

  <!-- Header -->
  <text x="550" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">Txtro Phase 9: End-to-End Voice Note Lifecycle &amp; Sequence Map</text>
  <text x="550" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">Complete Execution Trace: Capture, Signal Processing, Codec Streaming, OCI S3 Transfer, and Instant Delivery</text>

  <!-- Participant Headers -->
  <!-- 1. Sender UI (x=100) -->
  <rect x="35" y="80" width="130" height="42" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" rx="8"/>
  <text x="100" y="99" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Client Sender</text>
  <text x="100" y="113" fill="#818cf8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">React MessageInput</text>
  <line x1="100" y1="122" x2="100" y2="810" stroke="#334155" stroke-dasharray="4,4"/>

  <!-- 2. useAudioRecorder Hook (x=250) -->
  <rect x="185" y="80" width="130" height="42" fill="#0f172a" stroke="#475569" stroke-width="1.5" rx="8"/>
  <text x="250" y="99" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">useAudioRecorder</text>
  <text x="250" y="113" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Custom Audio Engine</text>
  <line x1="250" y1="122" x2="250" y2="810" stroke="#334155" stroke-dasharray="4,4"/>

  <!-- 3. Web Audio API (x=400) -->
  <rect x="335" y="80" width="130" height="42" fill="#064e3b" stroke="#10b981" stroke-width="1.5" rx="8"/>
  <text x="400" y="99" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Web Audio API</text>
  <text x="400" y="113" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Analyser &amp; DSP Nodes</text>
  <line x1="400" y1="122" x2="400" y2="810" stroke="#334155" stroke-dasharray="4,4"/>

  <!-- 4. MediaRecorder (x=550) -->
  <rect x="485" y="80" width="130" height="42" fill="#831843" stroke="#f43f5e" stroke-width="1.5" rx="8"/>
  <text x="550" y="99" fill="#ffe4e6" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">MediaRecorder</text>
  <text x="550" y="113" fill="#fda4af" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Opus / WebM Encoder</text>
  <line x1="550" y1="122" x2="550" y2="810" stroke="#334155" stroke-dasharray="4,4"/>

  <!-- 5. Node.js API (x=700) -->
  <rect x="635" y="80" width="130" height="42" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" rx="8"/>
  <text x="700" y="99" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Node.js Express</text>
  <text x="700" y="113" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Ticket &amp; Intent API</text>
  <line x1="700" y1="122" x2="700" y2="810" stroke="#334155" stroke-dasharray="4,4"/>

  <!-- 6. Oracle Cloud OCI (x=850) -->
  <rect x="785" y="80" width="130" height="42" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" rx="8"/>
  <text x="850" y="99" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Oracle Cloud S3</text>
  <text x="850" y="113" fill="#fde68a" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">OCI Object Storage</text>
  <line x1="850" y1="122" x2="850" y2="810" stroke="#334155" stroke-dasharray="4,4"/>

  <!-- 7. Recipient User (x=1000) -->
  <rect x="935" y="80" width="130" height="42" fill="#311042" stroke="#a855f7" stroke-width="1.5" rx="8"/>
  <text x="1000" y="99" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Recipient Peer</text>
  <text x="1000" y="113" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Socket.IO &amp; Player</text>
  <line x1="1000" y1="122" x2="1000" y2="810" stroke="#334155" stroke-dasharray="4,4"/>

  <!-- STEP 1: Tap Mic -->
  <line x1="100" y1="150" x2="246" y2="150" stroke="#6366f1" stroke-width="1.8" marker-end="url(#seqArrow)"/>
  <text x="175" y="143" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">1. startRecording()</text>

  <!-- STEP 2: getUserMedia -->
  <line x1="250" y1="175" x2="396" y2="175" stroke="#10b981" stroke-width="1.8" marker-end="url(#seqArrowGreen)"/>
  <text x="325" y="168" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">2. getUserMedia({ echo, noise, gain })</text>

  <line x1="396" y1="195" x2="254" y2="195" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#seqArrowGreen)"/>
  <text x="325" y="190" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Return active MediaStream</text>

  <!-- STEP 3: Connect Analyser & MediaRec -->
  <line x1="250" y1="220" x2="396" y2="220" stroke="#10b981" stroke-width="1.5" marker-end="url(#seqArrowGreen)"/>
  <text x="325" y="214" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">3. Attach AnalyserNode(64)</text>

  <line x1="250" y1="245" x2="546" y2="245" stroke="#f43f5e" stroke-width="1.8" marker-end="url(#seqArrowRose)"/>
  <text x="400" y="239" fill="#ffe4e6" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">4. new MediaRecorder(stream, opus) -&gt; start(200ms)</text>

  <!-- STEP 4: Live Sampling Box -->
  <rect x="70" y="270" width="510" height="90" fill="#1e1b4b" fill-opacity="0.5" stroke="#4338ca" stroke-dasharray="4,4" rx="8"/>
  <text x="85" y="288" fill="#818cf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">LOOP: Real-Time Signal Sampling &amp; Clock Engine (During Speech)</text>
  
  <line x1="400" y1="310" x2="254" y2="310" stroke="#10b981" stroke-width="1.5" marker-end="url(#seqArrowGreen)"/>
  <text x="325" y="304" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">getByteFrequencyData() (32 bins)</text>

  <line x1="250" y1="330" x2="104" y2="330" stroke="#6366f1" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <text x="175" y="324" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Update Dancing Bars (60 FPS)</text>

  <line x1="550" y1="345" x2="254" y2="345" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#seqArrowRose)"/>
  <text x="400" y="341" fill="#fda4af" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">ondataavailable -&gt; push chunk to audioChunksRef</text>

  <!-- STEP 5: Stop Recording -->
  <line x1="100" y1="385" x2="246" y2="385" stroke="#6366f1" stroke-width="1.8" marker-end="url(#seqArrow)"/>
  <text x="175" y="378" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">5. User taps Send Button -&gt; stopRecording()</text>

  <line x1="250" y1="410" x2="546" y2="410" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#seqArrowRose)"/>
  <text x="400" y="404" fill="#ffe4e6" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">requestData() &amp; recorder.stop()</text>

  <!-- Hardware Cleanup Box -->
  <rect x="230" y="425" width="200" height="42" fill="#450a0a" stroke="#dc2626" rx="6"/>
  <text x="330" y="442" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">STRICT HARDWARE RELEASE</text>
  <text x="330" y="457" fill="#fecaca" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">stream.getTracks().stop() + ctx.close()</text>

  <!-- STEP 6: Assembled Blob & 28 peaks -->
  <line x1="250" y1="490" x2="104" y2="490" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#seqArrowGreen)"/>
  <text x="175" y="483" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Return { audioFile, duration, waveform: [28 ints] }</text>

  <!-- STEP 7: Request Cloud Ticket -->
  <line x1="100" y1="520" x2="696" y2="520" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#seqArrow)"/>
  <text x="400" y="513" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">7. POST /api/v1/messages/upload-url [{ fileName, fileType: 'audio' }]</text>

  <line x1="700" y1="545" x2="846" y2="545" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#seqArrow)"/>
  <text x="775" y="539" fill="#fde68a" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Generate SigV4 PUT (15m)</text>

  <line x1="700" y1="570" x2="104" y2="570" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#seqArrow)"/>
  <text x="400" y="564" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Return { uploadIntentId, presignedUrl, publicFileUrl }</text>

  <!-- STEP 8: DIRECT TO OCI STREAM -->
  <rect x="80" y="590" width="800" height="50" fill="#78350f" fill-opacity="0.35" stroke="#f59e0b" stroke-width="1.5" rx="8"/>
  <line x1="100" y1="615" x2="846" y2="615" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#seqArrow)"/>
  <text x="475" y="609" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">8. DIRECT XHR PUT voice-note.webm (Bypasses Node.js Server RAM entirely!)</text>
  <text x="475" y="630" fill="#fde68a" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">HTTP 200 OK Confirmed Landed in OCI Bucket</text>

  <!-- STEP 9: Finalize Message -->
  <line x1="100" y1="665" x2="696" y2="665" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#seqArrow)"/>
  <text x="400" y="658" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">9. POST /api/v1/messages/send/:id { attachments, duration, waveform, uploadIntentId }</text>

  <!-- DB & Socket -->
  <rect x="670" y="685" width="220" height="38" fill="#1e3a8a" stroke="#3b82f6" rx="6"/>
  <text x="780" y="701" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Atomic DB Intent Resolution</text>
  <text x="780" y="715" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">UploadIntent: 'completed' + Message.create()</text>

  <!-- STEP 10: Socket Emit -->
  <line x1="700" y1="745" x2="996" y2="745" stroke="#a855f7" stroke-width="2" marker-end="url(#seqArrow)"/>
  <text x="850" y="738" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">10. socket.emit("newMessage", message)</text>

  <!-- HTTP 201 response -->
  <line x1="700" y1="770" x2="104" y2="770" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#seqArrowGreen)"/>
  <text x="400" y="764" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">HTTP 201 Created (Confirmed Message Document)</text>

  <!-- Recipient Play -->
  <rect x="930" y="780" width="140" height="35" fill="#581c87" stroke="#c084fc" rx="6"/>
  <text x="1000" y="796" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Instant Render VoiceNotePlayer</text>
  <text x="1000" y="808" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">0ms Decode - 28 DOM Spans</text>
</svg>