<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="p13SeqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#p13SeqBg)" rx="16"/>
  <rect x="1.5" y="1.5" width="997" height="697" fill="none" stroke="#1e293b" stroke-width="2" rx="15"/>

  <!-- Title -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold">Phase 13: End-to-End Live Message Editing Execution Map</text>
    <text x="0" y="20" fill="#94a3b8" font-family="sans-serif" font-size="12">Sequence Flow: Client Gesture &#x2192; Draft Isolation &#x2192; 0ms Optimistic UI &#x2192; Fast-Path CAS &#x2192; Socket Broadcast</text>
  </g>

  <!-- Swimlane Headers -->
  <g transform="translate(50, 85)">
    <!-- Sender Browser -->
    <rect x="0" y="0" width="160" height="36" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="80" y="22" fill="#c7d2fe" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Sender Client (React)</text>
    <line x1="80" y1="36" x2="80" y2="570" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- React State & Refs -->
    <rect x="180" y="0" width="160" height="36" rx="8" fill="#083344" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="260" y="22" fill="#a5f3fc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">State &amp; Refs Engine</text>
    <line x1="260" y1="36" x2="260" y2="570" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Express Controller -->
    <rect x="360" y="0" width="160" height="36" rx="8" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
    <text x="440" y="22" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Express Controller</text>
    <line x1="440" y1="36" x2="440" y2="570" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- MongoDB WiredTiger -->
    <rect x="540" y="0" width="160" height="36" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
    <text x="620" y="22" fill="#bbf7d0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">MongoDB (WiredTiger)</text>
    <line x1="620" y1="36" x2="620" y2="570" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Socket.IO Engine -->
    <rect x="720" y="0" width="180" height="36" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
    <text x="810" y="22" fill="#e9d5ff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Socket.IO &amp; Recipient</text>
    <line x1="810" y1="36" x2="810" y2="570" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Sequence Steps -->
  <g transform="translate(50, 130)">
    <!-- 1. Click Edit -->
    <g transform="translate(0, 20)">
      <path d="M80 0 L260 0" stroke="#6366f1" stroke-width="1.5" fill="none"/>
      <polygon points="256,-3 262,0 256,3" fill="#6366f1"/>
      <rect x="100" y="-12" width="140" height="20" rx="4" fill="#0f172a" stroke="#475569" stroke-width="0.75"/>
      <text x="170" y="2" fill="#c7d2fe" font-family="sans-serif" font-size="10" text-anchor="middle">1. Tap ✏️ Edit (canEdit &#x2705;)</text>
    </g>

    <!-- 2. Draft Snapshot & Banner -->
    <g transform="translate(0, 70)">
      <path d="M260 0 L80 0" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
      <polygon points="84,-3 78,0 84,3" fill="#06b6d4"/>
      <rect x="95" y="-12" width="150" height="20" rx="4" fill="#0f172a" stroke="#475569" stroke-width="0.75"/>
      <text x="170" y="2" fill="#a5f3fc" font-family="sans-serif" font-size="10" text-anchor="middle">2. Mount Banner, Isolate Draft</text>
    </g>

    <!-- 3. Submit Edit & Optimistic UI -->
    <g transform="translate(0, 130)">
      <path d="M80 0 L260 0" stroke="#0ea5e9" stroke-width="1.5" fill="none"/>
      <polygon points="256,-3 262,0 256,3" fill="#0ea5e9"/>
      <rect x="95" y="-12" width="150" height="20" rx="4" fill="#0f172a" stroke="#475569" stroke-width="0.75"/>
      <text x="170" y="2" fill="#7dd3fc" font-family="sans-serif" font-size="10" text-anchor="middle">3. 0ms Optimistic Bubble Morph</text>
    </g>

    <!-- 4. HTTP PATCH -->
    <g transform="translate(0, 190)">
      <path d="M80 0 L440 0" stroke="#10b981" stroke-width="1.5" fill="none"/>
      <polygon points="436,-3 442,0 436,3" fill="#10b981"/>
      <rect x="180" y="-12" width="160" height="20" rx="4" fill="#0f172a" stroke="#475569" stroke-width="0.75"/>
      <text x="260" y="2" fill="#a7f3d0" font-family="sans-serif" font-size="10" text-anchor="middle">4. PATCH /messages/edit/:id</text>
    </g>

    <!-- 5. Fast-Path CAS Query -->
    <g transform="translate(0, 250)">
      <path d="M440 0 L620 0" stroke="#22c55e" stroke-width="1.5" fill="none"/>
      <polygon points="616,-3 622,0 616,3" fill="#22c55e"/>
      <rect x="460" y="-12" width="140" height="20" rx="4" fill="#0f172a" stroke="#475569" stroke-width="0.75"/>
      <text x="530" y="2" fill="#86efac" font-family="sans-serif" font-size="10" text-anchor="middle">5. findOneAndUpdate (CAS Lock)</text>
    </g>

    <!-- 6. MongoDB Result -->
    <g transform="translate(0, 310)">
      <path d="M620 0 L440 0" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
      <polygon points="444,-3 438,0 444,3" fill="#22c55e"/>
      <rect x="460" y="-12" width="140" height="20" rx="4" fill="#0f172a" stroke="#475569" stroke-width="0.75"/>
      <text x="530" y="2" fill="#86efac" font-family="sans-serif" font-size="10" text-anchor="middle">6. Return Updated Document</text>
    </g>

    <!-- 7. Socket.IO Fan-out -->
    <g transform="translate(0, 370)">
      <path d="M440 0 L810 0" stroke="#a855f7" stroke-width="1.5" fill="none"/>
      <polygon points="806,-3 812,0 806,3" fill="#a855f7"/>
      <rect x="540" y="-12" width="170" height="20" rx="4" fill="#0f172a" stroke="#475569" stroke-width="0.75"/>
      <text x="625" y="2" fill="#d8b4fe" font-family="sans-serif" font-size="10" text-anchor="middle">7. emit(&apos;messageEdited&apos;, delta)</text>
    </g>

    <!-- 8. HTTP 200 Confirmation -->
    <g transform="translate(0, 430)">
      <path d="M440 0 L80 0" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
      <polygon points="84,-3 78,0 84,3" fill="#10b981"/>
      <rect x="180" y="-12" width="160" height="20" rx="4" fill="#0f172a" stroke="#475569" stroke-width="0.75"/>
      <text x="260" y="2" fill="#a7f3d0" font-family="sans-serif" font-size="10" text-anchor="middle">8. HTTP 200 OK (Confirmed)</text>
    </g>

    <!-- 9. Recipient Peer DOM Morph -->
    <g transform="translate(0, 490)">
      <rect x="730" y="-15" width="160" height="30" rx="6" fill="#1e1035" stroke="#9333ea" stroke-width="1"/>
      <text x="810" y="5" fill="#f3e8ff" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">In-Place DOM Morph</text>
    </g>
  </g>
</svg>