<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%">
  <defs>
    <linearGradient id="fsmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="fsmArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
    </marker>
    <marker id="fsmArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="fsmArrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="url(#fsmBg)" rx="16"/>
  <rect x="1" y="1" width="958" height="638" fill="none" stroke="#1f2937" stroke-width="2" rx="15"/>

  <!-- Title -->
  <text x="480" y="42" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Txtro Phase 10: Message Reaction Dock Finite State Machine (FSM)</text>
  <text x="480" y="65" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">State Transitions Across Mouse Hover, Touch Long-Press, Quick Dock &amp; Full Catalog</text>

  <!-- Start Circle -->
  <circle cx="100" cy="190" r="14" fill="#6366f1"/>
  <circle cx="100" cy="190" r="8" fill="#e0e7ff"/>
  <line x1="114" y1="190" x2="175" y2="190" stroke="#6366f1" stroke-width="2" marker-end="url(#fsmArrow)"/>

  <!-- STATE 1: IDLE -->
  <g transform="translate(185, 145)">
    <rect width="180" height="90" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" rx="12"/>
    <text x="90" y="32" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">IDLE</text>
    <text x="90" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Message bubble rendered</text>
    <text x="90" y="68" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Docks &amp; pickers unmounted</text>
  </g>

  <!-- Transition Idle -> Quick Dock -->
  <path d="M 365 175 L 530 175" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#fsmArrow)"/>
  <text x="450" y="165" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Hover (Desktop) /</text>
  <text x="450" y="195" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">350ms Hold (Mobile)</text>

  <!-- STATE 2: QUICK DOCK OPEN -->
  <g transform="translate(540, 145)">
    <rect width="220" height="90" fill="#064e3b" stroke="#10b981" stroke-width="2" rx="12"/>
    <text x="110" y="32" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">QUICK DOCK OPEN</text>
    <text x="110" y="52" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">👍 ❤️ 😂 😮 😢 🙏  [+]</text>
    <text x="110" y="70" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Spring hover scale active</text>
  </g>

  <!-- Transition Quick Dock -> Idle (Pointer Leave / Click Outside) -->
  <path d="M 580 235 C 500 300, 340 300, 275 235" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#fsmArrow)"/>
  <text x="420" y="295" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Mouse leave / Tap outside (Unmount dock)</text>

  <!-- Transition Quick Dock -> Full Picker Open -->
  <path d="M 760 190 L 830 190 C 860 190, 860 380, 770 380" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#fsmArrow)"/>
  <text x="880" y="275" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Tap &apos;+&apos; Button</text>
  <text x="880" y="292" fill="#c084fc" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">(Lazy Load Catalog)</text>

  <!-- STATE 3: FULL PICKER OPEN -->
  <g transform="translate(540, 340)">
    <rect width="220" height="90" fill="#3b0764" stroke="#a855f7" stroke-width="2" rx="12"/>
    <text x="110" y="32" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">FULL PICKER OPEN</text>
    <text x="110" y="52" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">3,600+ Unicode Emojis</text>
    <text x="110" y="68" fill="#c084fc" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Search &amp; Skin Tones Active</text>
  </g>

  <!-- Transition Full Picker -> Idle (Click Outside) -->
  <path d="M 540 385 L 290 385 C 250 385, 230 300, 240 235" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#fsmArrow)"/>
  <text x="390" y="375" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Click outside / Esc key (Unmount picker)</text>

  <!-- Transition Quick Dock / Full Picker -> Optimistic Applied -->
  <path d="M 620 235 L 620 490 L 460 490" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#fsmArrowGreen)"/>
  <path d="M 620 430 L 620 490" fill="none" stroke="#10b981" stroke-width="2"/>
  <text x="650" y="475" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Tap Any Emoji</text>

  <!-- STATE 4: OPTIMISTIC APPLIED -->
  <g transform="translate(240, 450)">
    <rect width="210" height="90" fill="#14532d" stroke="#22c55e" stroke-width="2" rx="12"/>
    <text x="105" y="32" fill="#86efac" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">OPTIMISTIC APPLIED</text>
    <text x="105" y="52" fill="#bbf7d0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Pill badge renders at 0ms</text>
    <text x="105" y="68" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Background HTTP POST sent</text>
  </g>

  <!-- Transition Optimistic -> Idle (Success Confirmation) -->
  <path d="M 310 450 L 310 235" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#fsmArrowGreen)"/>
  <text x="360" y="320" fill="#4ade80" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">HTTP 200 OK</text>
  <text x="360" y="336" fill="#86efac" font-family="system-ui, sans-serif" font-size="8.5">Confirmed DB State</text>

  <!-- Transition Optimistic -> Idle (Rollback on Error) -->
  <path d="M 270 450 L 270 235" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#fsmArrowRose)"/>
  <text x="210" y="320" fill="#fb7185" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Network Fail</text>
  <text x="210" y="336" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Rollback to Snapshot</text>
</svg>