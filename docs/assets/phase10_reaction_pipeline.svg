<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="100%" height="100%">
  <defs>
    <linearGradient id="p10GradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="p10Card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="p10Card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="p10Card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="p10Card4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="p10Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="p10ArrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
    </marker>
    <marker id="p10ArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="p10ArrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="p10ArrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="780" fill="url(#p10GradBg)" rx="16"/>
  <rect x="1" y="1" width="998" height="778" fill="none" stroke="#1f2937" stroke-width="2" rx="15"/>

  <!-- Title Banner -->
  <text x="500" y="42" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="0.5">Txtro Phase 10: Master Emoji &amp; Reaction Engine Architecture</text>
  <text x="500" y="65" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">0ms Optimistic UI • Atomic Concurrency Control • Zero-Bundle Code Splitting • Multi-Tab Sync</text>

  <!-- STAGE 1: Perception & Interaction -->
  <g transform="translate(40, 90)">
    <rect width="920" height="135" fill="url(#p10Card1)" stroke="#4338ca" stroke-width="1.5" rx="12" filter="url(#p10Shadow)"/>
    <rect x="16" y="14" width="85" height="24" fill="#4f46e5" rx="6"/>
    <text x="58" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">STAGE 1</text>
    <text x="115" y="31" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Interaction &amp; Dual Trigger Layer</text>

    <!-- Sub-elements -->
    <rect x="25" y="52" width="260" height="65" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" rx="8"/>
    <text x="155" y="74" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Desktop Hover Trigger</text>
    <text x="155" y="91" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">CSS group-hover on MessageBubble</text>
    <text x="155" y="105" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Reveals Floating Action Dock (0ms)</text>

    <line x1="285" y1="84" x2="325" y2="84" stroke="#6366f1" stroke-width="2" marker-end="url(#p10ArrowIndigo)"/>

    <rect x="335" y="52" width="260" height="65" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" rx="8"/>
    <text x="465" y="74" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Mobile Long-Press Trigger</text>
    <text x="465" y="91" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">350ms monotonic touch timer</text>
    <text x="465" y="105" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Cancels on scroll / swipe gesture</text>

    <line x1="595" y1="84" x2="635" y2="84" stroke="#6366f1" stroke-width="2" marker-end="url(#p10ArrowIndigo)"/>

    <rect x="645" y="52" width="250" height="65" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" rx="8"/>
    <text x="770" y="74" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Quick 6 Dock + &apos;+&apos; Button</text>
    <text x="770" y="91" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">👍 ❤️ 😂 😮 😢 🙏 + Custom</text>
    <text x="770" y="105" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Spring hover scale animation</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <line x1="500" y1="225" x2="500" y2="255" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#p10ArrowIndigo)"/>

  <!-- STAGE 2: 0ms Optimistic UI Layer -->
  <g transform="translate(40, 260)">
    <rect width="920" height="135" fill="url(#p10Card2)" stroke="#059669" stroke-width="1.5" rx="12" filter="url(#p10Shadow)"/>
    <rect x="16" y="14" width="85" height="24" fill="#10b981" rx="6"/>
    <text x="58" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">STAGE 2</text>
    <text x="115" y="31" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">0ms Optimistic UI &amp; State Mutation Engine</text>

    <!-- Sub-elements -->
    <rect x="25" y="52" width="260" height="65" fill="#064e3b" stroke="#10b981" stroke-width="1" rx="8"/>
    <text x="155" y="74" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Local State Snapshot</text>
    <text x="155" y="91" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Capture previousMessages ref</text>
    <text x="155" y="105" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Guarantees rollback safety on error</text>

    <line x1="285" y1="84" x2="325" y2="84" stroke="#10b981" stroke-width="2" marker-end="url(#p10ArrowGreen)"/>

    <rect x="335" y="52" width="260" height="65" fill="#064e3b" stroke="#10b981" stroke-width="1" rx="8"/>
    <text x="465" y="74" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Instant Local Array Mutation</text>
    <text x="465" y="91" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Same emoji: splice (toggle off)</text>
    <text x="465" y="105" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Diff emoji: in-place replace / push</text>

    <line x1="595" y1="84" x2="635" y2="84" stroke="#10b981" stroke-width="2" marker-end="url(#p10ArrowGreen)"/>

    <rect x="645" y="52" width="250" height="65" fill="#064e3b" stroke="#10b981" stroke-width="1" rx="8"/>
    <text x="770" y="74" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Pill Badge Render (&lt; 1ms)</text>
    <text x="770" y="91" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Dynamic count + active user ring</text>
    <text x="770" y="105" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">0ms perceived interaction lag</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <line x1="500" y1="395" x2="500" y2="425" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#p10ArrowGreen)"/>

  <!-- STAGE 3: Atomic Concurrency & MongoDB Locking -->
  <g transform="translate(40, 430)">
    <rect width="920" height="135" fill="url(#p10Card3)" stroke="#be123c" stroke-width="1.5" rx="12" filter="url(#p10Shadow)"/>
    <rect x="16" y="14" width="85" height="24" fill="#e11d48" rx="6"/>
    <text x="58" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">STAGE 3</text>
    <text x="115" y="31" fill="#ffe4e6" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Atomic Concurrency &amp; MongoDB Execution</text>

    <!-- Sub-elements -->
    <rect x="25" y="52" width="260" height="65" fill="#831843" stroke="#f43f5e" stroke-width="1" rx="8"/>
    <text x="155" y="74" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Scenario 1: First Reaction</text>
    <text x="155" y="91" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Atomic $push: { reactions: { ... } }</text>
    <text x="155" y="105" fill="#fb7185" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">No _id subdocument overhead (_id: false)</text>

    <line x1="285" y1="84" x2="325" y2="84" stroke="#f43f5e" stroke-width="2" marker-end="url(#p10ArrowRose)"/>

    <rect x="335" y="52" width="260" height="65" fill="#831843" stroke="#f43f5e" stroke-width="1" rx="8"/>
    <text x="465" y="74" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Scenario 2: Toggle Off</text>
    <text x="465" y="91" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Atomic $pull: { reactions: { userId } }</text>
    <text x="465" y="105" fill="#fb7185" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Serializes concurrent clicks safely</text>

    <line x1="595" y1="84" x2="635" y2="84" stroke="#f43f5e" stroke-width="2" marker-end="url(#p10ArrowRose)"/>

    <rect x="645" y="52" width="250" height="65" fill="#831843" stroke="#f43f5e" stroke-width="1" rx="8"/>
    <text x="770" y="74" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Scenario 3: Change Emoji</text>
    <text x="770" y="91" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Atomic $set: { &quot;reactions.$.emoji&quot; }</text>
    <text x="770" y="105" fill="#fb7185" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Positional update without re-insert</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <line x1="500" y1="565" x2="500" y2="595" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#p10ArrowRose)"/>

  <!-- STAGE 4: Real-Time Multi-Device Fan-Out -->
  <g transform="translate(40, 600)">
    <rect width="920" height="135" fill="url(#p10Card4)" stroke="#1d4ed8" stroke-width="1.5" rx="12" filter="url(#p10Shadow)"/>
    <rect x="16" y="14" width="85" height="24" fill="#2563eb" rx="6"/>
    <text x="58" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">STAGE 4</text>
    <text x="115" y="31" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Real-Time Multi-Device Broadcast &amp; Reconciliation</text>

    <!-- Sub-elements -->
    <rect x="25" y="52" width="260" height="65" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" rx="8"/>
    <text x="155" y="74" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Socket ID Resolution</text>
    <text x="155" y="91" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">[...getReceiverSocketIds(other),</text>
    <text x="155" y="105" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle"> ...getReceiverSocketIds(current)]</text>

    <line x1="285" y1="84" x2="325" y2="84" stroke="#3b82f6" stroke-width="2" marker-end="url(#p10ArrowBlue)"/>

    <rect x="335" y="52" width="260" height="65" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" rx="8"/>
    <text x="465" y="74" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">messageReactionUpdated Event</text>
    <text x="465" y="91" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Payload: { messageId, reactions }</text>
    <text x="465" y="105" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Synchronizes all browser tabs / devices</text>

    <line x1="595" y1="84" x2="635" y2="84" stroke="#3b82f6" stroke-width="2" marker-end="url(#p10ArrowBlue)"/>

    <rect x="645" y="52" width="250" height="65" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" rx="8"/>
    <text x="770" y="74" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Server State Confirmation</text>
    <text x="770" y="91" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">HTTP 200 Confirms State</text>
    <text x="770" y="105" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Guarantees 100% DB Parity</text>
  </g>
</svg>