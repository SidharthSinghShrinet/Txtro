<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" width="100%" height="100%">
  <defs>
    <linearGradient id="seqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="seqArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
    </marker>
    <marker id="seqArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="seqArrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <rect width="1100" height="860" fill="url(#seqBg)" rx="16"/>
  <rect x="1" y="1" width="1098" height="858" fill="none" stroke="#1f2937" stroke-width="2" rx="15"/>

  <!-- Title -->
  <text x="550" y="42" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Txtro Phase 10: End-to-End Reaction Lifecycle &amp; Sequence Map</text>
  <text x="550" y="65" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">Client A (Sender) • Optimistic Store • Express Controller • MongoDB (Atomic Lock) • Socket.IO • Client B (Peer)</text>

  <!-- Lifeline Headers -->
  <!-- Col 1: Client A (User) -->
  <rect x="50" y="85" width="130" height="42" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" rx="8"/>
  <text x="115" y="105" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Client A UI</text>
  <text x="115" y="119" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">(React V8)</text>
  <line x1="115" y1="127" x2="115" y2="820" stroke="#312e81" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Col 2: Optimistic Store -->
  <rect x="230" y="85" width="130" height="42" fill="#064e3b" stroke="#10b981" stroke-width="1.5" rx="8"/>
  <text x="295" y="105" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Optimistic Store</text>
  <text x="295" y="119" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">(HomePage State)</text>
  <line x1="295" y1="127" x2="295" y2="820" stroke="#065f46" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Col 3: Express API -->
  <rect x="410" y="85" width="130" height="42" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" rx="8"/>
  <text x="475" y="105" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Node.js Express</text>
  <text x="475" y="119" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">(toggleReaction)</text>
  <line x1="475" y1="127" x2="475" y2="820" stroke="#1e40af" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Col 4: MongoDB Atlas -->
  <rect x="590" y="85" width="130" height="42" fill="#831843" stroke="#f43f5e" stroke-width="1.5" rx="8"/>
  <text x="655" y="105" fill="#ffe4e6" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">MongoDB Atlas</text>
  <text x="655" y="119" fill="#fda4af" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">(Atomic Operations)</text>
  <line x1="655" y1="127" x2="655" y2="820" stroke="#9f1239" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Col 5: Socket.IO Server -->
  <rect x="770" y="85" width="130" height="42" fill="#581c87" stroke="#a855f7" stroke-width="1.5" rx="8"/>
  <text x="835" y="105" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Socket.IO Server</text>
  <text x="835" y="119" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">(Cluster Broadcaster)</text>
  <line x1="835" y1="127" x2="835" y2="820" stroke="#6b21a8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Col 6: Client B (Peer) -->
  <rect x="940" y="85" width="120" height="42" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" rx="8"/>
  <text x="1000" y="105" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Client B (Peer)</text>
  <text x="1000" y="119" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">(Partner Browser)</text>
  <line x1="1000" y1="127" x2="1000" y2="820" stroke="#312e81" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Sequence Steps -->
  <!-- Step 1: User hover/long-press -->
  <line x1="115" y1="155" x2="295" y2="155" stroke="#6366f1" stroke-width="1.8" marker-end="url(#seqArrow)"/>
  <text x="205" y="147" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">1. User clicks ❤️ on Quick Dock</text>

  <!-- Step 2: Optimistic Mutation -->
  <rect x="260" y="170" width="70" height="40" fill="#065f46" rx="4"/>
  <text x="295" y="186" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">0ms Paint</text>
  <text x="295" y="200" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Update State</text>

  <line x1="295" y1="225" x2="115" y2="225" stroke="#10b981" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#seqArrowGreen)"/>
  <text x="205" y="218" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">2. Re-render Pill Badge (0ms Latency)</text>

  <!-- Step 3: Network POST -->
  <line x1="115" y1="265" x2="475" y2="265" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#seqArrow)"/>
  <text x="295" y="257" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">3. POST /api/v1/messages/react/:messageId { emoji: &quot;❤️&quot; }</text>

  <!-- Step 4: Mongo Find & Check -->
  <line x1="475" y1="305" x2="655" y2="305" stroke="#f43f5e" stroke-width="1.8" marker-end="url(#seqArrowRose)"/>
  <text x="565" y="297" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">4. findById(messageId) select reactions</text>

  <line x1="655" y1="340" x2="475" y2="340" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#seqArrowRose)"/>
  <text x="565" y="333" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">5. Return message document</text>

  <!-- Step 6: Atomic Decision Block -->
  <rect x="440" y="365" width="250" height="95" fill="#1e1e38" stroke="#f43f5e" stroke-width="1.2" rx="8"/>
  <text x="565" y="385" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">6. Atomic MongoDB Branching</text>
  <text x="565" y="405" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">• Not Reacted ➔ $push { userId, emoji }</text>
  <text x="565" y="423" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">• Same Emoji  ➔ $pull { userId }</text>
  <text x="565" y="441" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">• Diff Emoji  ➔ $set { &quot;reactions.$.emoji&quot; }</text>

  <!-- Step 7: Atomic Execution -->
  <line x1="475" y1="485" x2="655" y2="485" stroke="#f43f5e" stroke-width="2" marker-end="url(#seqArrowRose)"/>
  <text x="565" y="477" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">7. Execute findOneAndUpdate (Atomic Row Lock)</text>

  <line x1="655" y1="520" x2="475" y2="520" stroke="#10b981" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#seqArrowGreen)"/>
  <text x="565" y="513" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">8. Return updatedMessage.reactions</text>

  <!-- Step 9: HTTP 200 response -->
  <line x1="475" y1="555" x2="115" y2="555" stroke="#10b981" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#seqArrowGreen)"/>
  <text x="295" y="547" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">9. HTTP 200 OK: Reconcile server reactions</text>

  <!-- Step 10: Broadcast to Socket.IO -->
  <line x1="475" y1="595" x2="835" y2="595" stroke="#a855f7" stroke-width="2" marker-end="url(#seqArrow)"/>
  <text x="655" y="587" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">10. Broadcast messageReactionUpdated</text>

  <!-- Step 11: Multi-Socket Fan-out -->
  <rect x="750" y="620" width="170" height="55" fill="#3b0764" stroke="#a855f7" stroke-width="1" rx="6"/>
  <text x="835" y="638" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Socket ID Targets</text>
  <text x="835" y="653" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">• All Client B active sockets</text>
  <text x="835" y="667" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">• Client A other tabs / mobile</text>

  <!-- Step 12: Emit to Client B -->
  <line x1="835" y1="700" x2="1000" y2="700" stroke="#a855f7" stroke-width="2" marker-end="url(#seqArrow)"/>
  <text x="917" y="692" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">11. socket.emit()</text>

  <rect x="965" y="715" width="70" height="40" fill="#312e81" rx="4"/>
  <text x="1000" y="731" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Live Sync</text>
  <text x="1000" y="745" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Update Bubble</text>

  <!-- Step 13: Emit back to Client A other tabs -->
  <line x1="835" y1="775" x2="115" y2="775" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#seqArrow)"/>
  <text x="475" y="767" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">12. Sync Client A second browser tab / Mobile PWA instance</text>
</svg>